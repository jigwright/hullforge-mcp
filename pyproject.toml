[project]
name = "hullforge-mcp"
version = "0.1.0"
description = "MCP connector for HullForge, driving a running Unreal Engine 5 editor from Claude"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Jigwright", email = "support@jigwright.com" }
]
requires-python = ">=3.13"
keywords = ["mcp", "unreal-engine", "claude", "gamedev"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "mcp>=2.0.0",
]

[project.urls]
Homepage = "https://jigwright.com/hullforge"
Documentation = "https://jigwright.com/hullforge/docs"
Issues = "https://github.com/jigwright/hullforge-mcp/issues"

[project.scripts]
hullforge-mcp = "hullforge_mcp.server:main"

[dependency-groups]
dev = [
    "anyio>=4.11.0",
    "nuitka>=2.8",
    "pyinstaller>=6.16.0",
    "pytest>=8.4.2",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hullforge_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests need a running Unreal editor with the plugin loaded, so they
# are deselected by default. Run them with: uv run pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: needs a live Unreal editor running HullForge",
]
